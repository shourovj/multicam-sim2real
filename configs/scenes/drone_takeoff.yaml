# drone_takeoff: one quadcopter lifts off the grass and climbs to the right, passing behind a small
# foreground tree on the way up. Same camera, sky and ground as drones_air.
# World frame: Z up, metres. The camera sits at x=0 and looks along +Y, tilted slightly up.
name: drone_takeoff
duration_s: 5.1            # 153 frames at 30 fps; frame counts must be 1 + 4n (plan §4)
fps: 30
frames: 153
resolution: [832, 480]     # W, H
seed: 0
render: {samples: 48, denoise: true}

camera:
  type: perspective
  position: [0.0, 0.0, 1.6]
  look_at: [0.0, 10.0, 2.3]   # ~4 deg upward pitch; the ground is in view from about 8 m out
  fov_deg: 50                 # horizontal
  motion: static

background:
  type: procedural            # no downloaded assets
  sky: {model: nishita, sun_elevation_deg: 35, sun_rotation_deg: 200, strength: 0.22}
  ground: {size_m: 4000, colors: [[0.10, 0.17, 0.04], [0.30, 0.27, 0.12]], noise_scale: 0.08}

occluders:
  # A small tree 6 m from the camera, between it and the drone's climb. `position` is the trunk base.
  - {type: tree, position: [0.3, 6.0], trunk_height_m: 2.1, crown_radius_m: 0.55}

objects:
  # trajectory keyframes: [t_s, x, y, z, yaw_deg]; Catmull-Rom between keys.
  # ground_z is the body-centre height at rest: the path never dips below it (sim/motion.py).
  - id: drone_1
    instance_id: 1
    asset: {type: quadcopter, arm_span_m: 0.62, body_color: [0.85, 0.30, 0.05]}
    trajectory:
      ground_z: 0.035
      keyframes:
        - [0, -2.20, 10.00, 0.035, 20]     # resting on the grass, left of the tree
        - [0.7, -2.20, 10.00, 0.035, 20]   # rotors up to speed, still on the ground
        - [1.6, -1.90, 10.00, 1.10, 20]    # lift-off, nearly straight up
        - [2.6, -0.60, 10.00, 2.40, 20]    # climbing to the right, about to pass behind the tree
        - [3.6, 0.90, 10.00, 3.10, 20]     # behind the crown
        - [5.1, 2.60, 10.00, 3.90, 20]     # clear of the tree, upper right

events:                      # ground truth for eval
  - {name: liftoff, t: 0.9}
  - {name: occluded_by_tree, t: 3.2}

tracks: {points_per_object: 16}
