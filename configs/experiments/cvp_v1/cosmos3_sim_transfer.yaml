# cvp_v1, the four-model benchmark: Cosmos3-Nano-Sim-Transfer.
# The four files in this folder differ only in the model. Same two scenes (rev 2, clay), cameras, cut, seeds and clip
# (113 frames at 16 fps, 832x480), same out_root, so they share one simulated world and one set of bundles, and each
# model's runs sit next to the others' under gen/<view>/D/<model name>/. One control, the simulator's depth video, and
# no first frame: depth is the one control all four models take. Appearance comes only from the prompt.
# Prompt: the blocks in configs/prompts/multicam_v1/<scene>/, as Cosmos3's structured caption (composed/<view>.json).
# Runner: gen/run_multicam.py; this model's scripts: gen/cosmos3_sim_transfer/.
# Settings: multicam_v1.2's condition D (NVIDIA's Stage 3 recipe): 4 fixed steps, no guidance, so no negative prompt is used.
experiment: cvp_v1_cosmos3_sim_transfer
out_root: cv-project/multi-cam

scenes:
  intersection_4way: {rev: 2, spec: configs/scenes/intersection_4way.yaml, prompts: configs/prompts/multicam_v1/intersection_4way}
  robot_pour:        {rev: 2, spec: configs/scenes/robot_pour.yaml,        prompts: configs/prompts/multicam_v1/robot_pour}

model:
  name: cosmos3-nano-sim-transfer
  family: sim-transfer
  hf: nvidia/Cosmos3-Nano-Sim-Transfer
  revision: 45510d5b8cefa338b7abc01eb702cf1e9cdf6742
  text_tokenizer: nvidia/Cosmos3-Nano@e59a53c25979a090fa8706c9acc0c254a6e89b92
  vae: Wan-AI/Wan2.2-TI2V-5B@921dbaf3f1674a56f47e83fb80a34bac8a8f203e
  framework_commit: 5950e7b4ea3677b99a2de279a7ed7058b5446e42

sampler: {num_steps: 4, guidance: 1.0, control_guidance: 1.0, shift: 5.0}    # fixed by the distilled checkpoint

video: {num_frames: 113, fps: 16, resolution: "480", aspect_ratio: "16,9"}     # 832x480, 7.06 s: the same clip for every model
first_frame: none

conditions:
  D: {depth: {}}            # the bundle's depth video (sim/world/controls.py): inverse depth, near bright, one scale per clip

cuts:
  intersection_4way: {cut3: [{cam: cctv, frames: [0, 36]}, {cam: dashcam, frames: [37, 76]}, {cam: phone, frames: [77, 112]}]}
  robot_pour:        {cut3: [{cam: side, frames: [0, 36]}, {cam: wrist, frames: [37, 76]}, {cam: cctv, frames: [77, 112]}]}

seeds: [0, 1]

gpu: {min_free_gib: 40, max_parallel: 4, launch_gap_s: 60, retries: 1}
