# p2s_v1: the prompt-to-sim pipeline end to end, on Cosmos3-Nano (base).
# The scenes come from prompt files (p2s/prompts/), are simulated on PhysX and rendered in Blender (p2s/build_scene.sh),
# and each camera view is then generated from one of the simulator's control videos. The files in this folder differ
# only in the model and in which controls that model takes; they share out_root, so they share one world and one set
# of bundles, and each model's runs sit side by side under gen/<view>/<condition>/<model name>/.
# Clip: 113 frames at 16 fps, 832x480, no first frame. Appearance comes only from the prompt.
# Prompt: each scene's caption blocks (the `prompts:` folder below), as Cosmos3 structured caption (composed/<view>.json).
# Runner: p2s/3_generate/run_multicam.py; this model's scripts: p2s/3_generate/models/cosmos3_nano/. Model and sampler settings: cvp_v1/cosmos3_nano.yaml's.
experiment: p2s_v1_cosmos3_nano
out_root: cv-project/p2s

scenes:      # p2s: the prompt file the scene is built from (bash p2s/build_scene.sh <file>); prompts: the video models' captions
  intersection: {rev: 1, p2s: p2s/prompts/intersection.yaml, prompts: p2s/captions/intersection}
  robot_pour:   {rev: 1, p2s: p2s/prompts/robot_pour.yaml,   prompts: p2s/captions/robot_pour}
  ball_ramp:    {rev: 1, p2s: p2s/prompts/ball_ramp.yaml,    prompts: p2s/captions/ball_ramp}      # scene written by the SceneAgent; starter captions (p2s/3_generate/write_captions.py)

model:
  name: cosmos3-nano
  family: cosmos3-nano
  hf: nvidia/Cosmos3-Nano
  revision: 45666784803b3a7ad577e0def405f9afcc3bddb2
  framework_commit: 5950e7b4ea3677b99a2de279a7ed7058b5446e42

sampler: {num_steps: 50, guidance: 3.0, control_guidance: 1.5, shift: 10.0}

video: {num_frames: 113, fps: 16, resolution: "480", aspect_ratio: "16,9"}     # 832x480, 7.06 s: the same clip for every model
first_frame: none

conditions:      # the simulator's control videos, from each camera's bundle (p2s/2_render/control_videos.py)
  D: {depth: {}}                # depth video: inverse depth, near bright, one scale per clip
  S: {seg: {}}                  # segmentation video: one flat colour per object and per scenery part
  E: {edge: {}}                 # geometry edges: object outlines, depth steps and creases, white on black
  G: {depth: {weight: 1.0}, seg: {weight: 1.0}}    # depth and segmentation together (only this model takes two controls)

cuts:
  intersection: {cut3: [{cam: cctv, frames: [0, 36]}, {cam: dashcam, frames: [37, 76]}, {cam: phone, frames: [77, 112]}]}
  robot_pour:   {cut3: [{cam: side, frames: [0, 36]}, {cam: wrist, frames: [37, 76]}, {cam: cctv, frames: [77, 112]}]}

seeds: [0, 1]

gpu: {min_free_gib: 50, max_parallel: 4, launch_gap_s: 120, retries: 1}
