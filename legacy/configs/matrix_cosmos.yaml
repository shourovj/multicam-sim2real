# The same scenes, conditions and seeds as legacy/configs/matrix.yaml, on Cosmos3-Nano (base).
#   python legacy/gen/run_matrix.py --matrix legacy/configs/matrix_cosmos.yaml [--status]
# No `steps`: Nano keeps its own defaults per mode (35 for text and first frame, 50 for transfer),
# and outputs go to <condition>/cosmos3-nano/seed<k>/.
model: cosmos3-nano            # gen/run_cosmos_nano.sh; gen/cosmos_nano_request.py maps each condition to a Nano mode
scenes: [drones_air_phys, drone_takeoff_phys, convoy_overhead_phys]
seeds: [0, 1, 2]
seeds_override: {A: [0], Aplus: [0]}

conditions:
  Vraw_edit: edited frame 0 + the simulator's colour video, unblurred, as a blur control   # dense reference, not sparse control
  Bbox_edit: edited frame 0 + boxes as an edge control      # Nano has no box input; outlines go in as white edges on black
  Bbox: simulator frame 0 + boxes as an edge control
  C0: depth, no frame 0
  B_edit: text + edited frame 0
  B: text + simulator frame 0
  P1_edit: edited frame 0 + box edges for the first second, then an empty edge map    # not a clean equivalent of P1
  A: text
  Aplus: detailed text describing the path
  C: simulator frame 0 + depth

gpu:
  max_parallel: 4
  retries: 2
  launch_gap_s: 75             # Nano loads and claims its memory in under a minute (Wan needs the default 240)
  modes:
    - {name: full_gpu, min_free_gib: 50}     # the whole model on one GPU, about 44 GB; transfer cannot use CPU offload
