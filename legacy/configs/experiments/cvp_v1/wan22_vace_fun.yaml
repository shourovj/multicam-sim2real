# cvp_v1, the four-model benchmark: Wan2.2-VACE-Fun-A14B (VideoX-Fun).
# The four files in this folder differ only in the model. Same two scenes (rev 2, clay), cameras, cut, seeds and clip
# (113 frames at 16 fps, 832x480), same out_root, so they share one simulated world and one set of bundles, and each
# model's runs sit next to the others' under gen/<view>/D/<model name>/. One control, the simulator's depth video, and
# no first frame: depth is the one control all four models take. Appearance comes only from the prompt.
# Prompt: the blocks in legacy/configs/prompts/multicam_v1/<scene>/, as one paragraph (composed/<view>.txt, p2s/3_generate/compose_prompts.py).
# Runner: p2s/3_generate/run_multicam.py; this model's scripts: p2s/3_generate/models/wan22_vace_fun/.
# Settings: VideoX-Fun's own for this model (examples/wan2.2_vace_fun/predict_v2v_control.py): 50 steps, guidance 5,
# shift 12, its default negative prompt. The depth video is the VACE control on every frame (mask all white).
# The model was trained on 81-frame clips; 113 frames is longer than that.
experiment: cvp_v1_wan22_vace_fun
out_root: cv-project/multi-cam

scenes:
  intersection_4way: {rev: 2, spec: legacy/configs/scenes/intersection_4way.yaml, prompts: legacy/configs/prompts/multicam_v1/intersection_4way}
  robot_pour:        {rev: 2, spec: legacy/configs/scenes/robot_pour.yaml,        prompts: legacy/configs/prompts/multicam_v1/robot_pour}

model:
  name: wan22-vace-fun-a14b
  family: wan22-vace-fun
  hf: alibaba-pai/Wan2.2-VACE-Fun-A14B
  revision: 4438caabbfdd7437bbb0283d86cb200d1b7223ba
  framework: VideoX-Fun
  framework_commit: e8c314fbfa494d0429bbef605c9f6112b79a7ead

sampler: {num_steps: 50, guidance: 5.0, shift: 12.0}
negative_prompt: p2s/3_generate/negative_prompts/wan22_negative_prompt.txt     # frozen copy of VideoX-Fun's default for Wan

video: {num_frames: 113, fps: 16, resolution: "480", aspect_ratio: "16,9"}     # 832x480, 7.06 s: the same clip for every model
first_frame: none

conditions:
  D: {depth: {}}            # the bundle's depth video (p2s/2_render/control_videos.py): inverse depth, near bright, one scale per clip

cuts:
  intersection_4way: {cut3: [{cam: cctv, frames: [0, 36]}, {cam: dashcam, frames: [37, 76]}, {cam: phone, frames: [77, 112]}]}
  robot_pour:        {cut3: [{cam: side, frames: [0, 36]}, {cam: wrist, frames: [37, 76]}, {cam: cctv, frames: [77, 112]}]}

seeds: [0, 1]

gpu: {min_free_gib: 65, max_parallel: 4, launch_gap_s: 240, retries: 1}     # Wan loads slowly: wait before judging the GPUs again
