# Frozen prompts for drone_takeoff. Same template as drones_air: objects with colours, ground,
# background and sky, camera, then the same style sentence.
scene: drone_takeoff
base: >-
  A small quadcopter with an orange body takes off from a flat green grass field and climbs into
  the air in front of a static camera, passing behind a small tree in the foreground. There is a
  line of trees in the distance, under a soft blue sky. Realistic footage, smooth natural motion,
  the camera does not move.
# A+: base wording plus the scripted motion, written from configs/scenes/drone_takeoff.yaml.
detailed: >-
  A small quadcopter with an orange body takes off from a flat green grass field and climbs into
  the air in front of a static camera, passing behind a small tree in the foreground. There is a
  line of trees in the distance, under a soft blue sky. At the start the quadcopter rests on the
  grass in the lower left of the frame, to the left of the tree. After a moment it lifts straight
  up off the ground, then climbs steadily up and to the right. About halfway through the video it
  passes behind the leafy crown of the tree in the middle of the frame and is hidden for about a
  second. It comes out on the right side of the tree, still climbing, and ends in the upper right
  of the frame. Realistic footage, smooth natural motion, the camera does not move.
negative: null   # use each model's default negative prompt
