# Frozen prompts for convoy_overhead. Same template as drones_air: objects with colours, ground,
# background, camera, then the same style sentence.
scene: convoy_overhead
base: >-
  An olive green army tank followed by two olive green army trucks drives along a pale dirt road
  through dense green woodland, seen from directly above. The road curves, passes under a concrete
  bridge and runs under the tree canopy. Realistic aerial footage, smooth natural motion, the
  camera does not move.
# A+: base wording plus the scripted motion, written from configs/scenes/convoy_overhead.yaml.
detailed: >-
  An olive green army tank followed by two olive green army trucks drives along a pale dirt road
  through dense green woodland, seen from directly above. The road curves, passes under a concrete
  bridge and runs under the tree canopy. At the start all three vehicles are in the left half of
  the frame, driving to the right in a line with even gaps: the tank in front, then the first
  truck, then the second truck at the far left. A grey concrete bridge crosses the road between
  the two trucks, and the second truck drives under it in the first second. The road then bends
  and disappears under the trees in the middle of the frame. The tank drives under the trees first
  and is hidden, then the first truck, then the second truck. The tank comes back into view on
  the right side of the frame about three seconds in and keeps driving to the right, and the first
  truck comes out behind it at the very end. Realistic aerial footage, smooth natural motion, the
  camera does not move.
negative: null   # use each model's default negative prompt


